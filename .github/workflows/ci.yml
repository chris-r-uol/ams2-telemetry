name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, node: 24 }
          - { os: ubuntu-latest, node: 24 }
          - { os: ubuntu-latest, node: 22 }
          - { os: macos-latest, node: 24 }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Smoke test the demo server
        shell: bash
        run: |
          node --disable-warning=ExperimentalWarning src/server/index.ts --source demo --prefill 3 --port 8606 --data ./ci-data &
          SERVER=$!
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8606/api/status > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8606/api/sessions | node -e '
            let body = "";
            process.stdin.on("data", (c) => (body += c)).on("end", () => {
              const sessions = JSON.parse(body);
              const laps = sessions[0]?.laps.length ?? 0;
              console.log(`sessions: ${sessions.length}, laps: ${laps}`);
              if (laps < 3) process.exit(1);
            });'
          curl -sf http://127.0.0.1:8606/ | grep -q '<div id="root">'
          kill $SERVER || true
